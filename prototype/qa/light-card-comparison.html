<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灯带卡片局部对照</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #e9edf1; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      main { display: flex; gap: 28px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 12px; font-size: 18px; font-weight: 700; text-align: center; }
      img {
        display: block;
        width: 510px;
        height: 160px;
        border-radius: 24px;
        box-shadow: 0 18px 46px rgba(28, 38, 48, 0.18);
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>选定视觉稿</figcaption>
        <img src="./light-card-source-focus.png" alt="选定视觉稿灯带卡片" />
      </figure>
      <figure>
        <figcaption>修正后的可交互原型</figcaption>
        <img src="./light-card-implementation-focus.jpg" alt="修正后的灯带卡片" />
      </figure>
    </main>
  </body>
</html>
